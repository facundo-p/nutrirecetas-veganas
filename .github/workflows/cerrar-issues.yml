name: Cerrar issues al mergear

# GitHub solo auto-cierra issues cuando el PR mergea a la rama por defecto (main).
# Acá todo el trabajo entra por staging, así que sin esto "Closes #N" no cerraría
# nunca nada — y el workflow "Item closed → Hecho" del tablero nunca se dispararía.
on:
  pull_request:
    types: [closed]
    branches: [staging]

permissions:
  issues: write
  pull-requests: write

jobs:
  cerrar:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # El cuerpo del PR entra por env, no interpolado en el script: es texto que
      # escribe cualquiera y no tiene por qué llegar al shell.
      - name: Cerrar los issues que el PR declara
        env:
          GH_TOKEN: ${{ github.token }}
          CUERPO: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          printf '%s' "$CUERPO" \
            | grep -oiE '\b(close[sd]?|fixe?[sd]?|resolve[sd]?) +#[0-9]+' \
            | grep -oE '[0-9]+' | sort -u > issues.txt

          # Todo trabajo entra por la rama de su issue, así que un PR sin issue
          # es trabajo sin registro. Antes esto salía en silencio y no se
          # enteraba nadie; ahora queda escrito en el PR y en rojo en Actions.
          # Los PR de release quedan afuera solos: van a main, no a staging.
          if [ ! -s issues.txt ]; then
            gh pr comment "$PR" --repo "$REPO" --body \
              "Este PR se mergeó a \`staging\` sin declarar ningún issue. En este proyecto la planificación vive en los Issues y toda rama sale de uno: si el trabajo tenía issue, faltó el \`Closes #N\` en el cuerpo; si no lo tenía, conviene abrirlo para que quede el rastro."
            echo "::error::El PR #$PR no declara ningún issue."
            exit 1
          fi

          while read -r n; do
            gh issue close "$n" --repo "$REPO" --reason completed \
              --comment "Cerrado por el PR #$PR al mergear a \`staging\`." \
              && echo "#$n cerrado" \
              || echo "#$n no se pudo cerrar (¿ya estaba cerrado?)"
          done < issues.txt
