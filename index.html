<!doctype html>
<html lang="es-AR" data-tema="papel">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E4DCC6" />
    <meta name="description" content="Recetario vegano personal con base nutricional. Offline, sin cuentas, sin backend." />
    <title>Nutrirecetas</title>
    <!-- Resuelve el tema antes de pintar: sin esto la app cargaría en el default
         y saltaría de color. Es la misma lógica que leerPreferencia y
         resolverTema de src/app/tema.ts, repetida porque corre antes del bundle;
         que la lista no se desincronice lo verifica
         src/styles/contrato-de-temas.test.ts. -->
    <script>
      (function () {
        var TEMAS = ['papel', 'musgo'];
        try {
          var t = new URLSearchParams(location.search).get('tema');
          if (t !== 'auto' && TEMAS.indexOf(t) === -1) t = localStorage.getItem('tema');
          if (TEMAS.indexOf(t) === -1) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'musgo' : 'papel';
          document.documentElement.dataset.tema = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
